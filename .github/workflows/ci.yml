name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError"

jobs:
  # ── 1. 核心层单测：纯 Kotlin，不依赖 Android SDK，跑得最快，最早给反馈 ──
  core-test:
    name: 核心模块单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # :core:data 是数据层（SQLite/SQLDelight）。它在 JVM 内存库上跑建表、迁移链与
      # DAO 测试，不需要模拟器——这是选 SQLDelight 而非 Room 的核心理由。
      - name: 运行核心模块单元测试（Agent 主循环 / 归约器 / 数据层）
        run: ./gradlew :core:agent:test :core:uistate:test :core:data:test --console=plain

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/agent/build/reports/tests/
            core/uistate/build/reports/tests/
            core/data/build/reports/tests/

  # ── 2. Android 编译：Compose / AGP 代码只有这一步能真正验证 ──
  android-build:
    name: 编译 Debug APK
    runs-on: ubuntu-latest
    needs: core-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: 编译
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # ── 2b. Release 构建验证：只验证「能编出来」，不产出可分发物 ──
  #
  # 为什么单独加这一步：R8 混淆规则、资源收缩、签名配置只有在 Release 构建里
  # 才会真正执行。等打 tag 发版时才发现 proguard 规则写错，修复成本要高得多
  # （要回滚 tag、重发版本）。放在这里每轮 PR 都验一遍，问题当场暴露。
  #
  # 这里用的是 CI 现场生成的**一次性** keystore，与正式发布密钥无关：
  #   · 不需要把正式密钥暴露给每一次 PR 构建；
  #   · 构建出来的 APK 直接丢弃，不上传产物。
  release-build:
    name: 验证 Release 构建（R8 + 签名）
    runs-on: ubuntu-latest
    needs: core-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: 生成一次性测试密钥
        # PKCS12 下 store 与 key 必须用同一口令，否则签名阶段报
        # "not a private key"（本地用正式密钥实测复现过）。
        run: |
          set -euo pipefail
          PW="ci-verify-$(date +%s)"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-verify.jks" \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 1 \
            -alias ci-verify \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=CI Verify, OU=CI, O=DeepCore, C=CN"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/ci-verify.jks" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=ci-verify" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 校验签名方案
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物: $APK ($(du -h "$APK" | cut -f1))"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK"
          else
            echo "apksigner 不可用，跳过"
          fi

      - name: 确认混淆确实生效
        # 防止哪天有人把 isMinifyEnabled 改回 false 而没人发现。
        # 判据：mapping.txt 存在，且里面有真实的类名重写记录。
        run: |
          set -euo pipefail
          M=app/build/outputs/mapping/release/mapping.txt
          if [ ! -s "$M" ]; then
            echo "::error::mapping.txt 不存在或为空，R8 混淆可能未生效"
            exit 1
          fi
          REMAPPED=$(grep -cE "^com\.deepcode\.[a-zA-Z0-9_.]+ -> [a-z][a-zA-Z0-9_.]*:$" "$M" || true)
          echo "被重命名的类条目: $REMAPPED"
          if [ "$REMAPPED" -lt 5 ]; then
            echo "::error::几乎没有被混淆的类（$REMAPPED 条），检查 proguard 规则是否把整个包 keep 住了"
            exit 1
          fi

  # ── 3. 设计系统守卫：业务层绕过组件库 = 构建失败 ──
  design-guard:
    name: 设计系统守卫
    runs-on: ubuntu-latest
    needs: core-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: 运行自定义 Lint 规则
        run: ./gradlew :app:lintDebug :feature:chat:lintDebug --console=plain

      - name: 上传 Lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-debug.html
            feature/chat/build/reports/lint-results-debug.html
