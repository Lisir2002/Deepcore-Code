name: Release

# 打 tag 即发布：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: 发布前先跑测试
        run: ./gradlew :core:agent:test :core:uistate:test --console=plain

      # 从 Secrets 还原 keystore。仓库里不存密钥，只有 base64 密文。
      # 解码到 $RUNNER_TEMP 而非工作区，避免被后续步骤误打包进产物。
      - name: 还原签名密钥
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "::error::缺少 Secret SIGNING_KEYSTORE_BASE64，无法构建正式签名包"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/deepcode-release.jks"
          ls -l "$RUNNER_TEMP/deepcode-release.jks"

      - name: 构建 Release APK（R8 混淆 + 正式签名）
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/deepcode-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 校验签名与加固结果
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物: $APK  ($(du -h "$APK" | cut -f1))"
          # 有 apksigner 就验全套签名方案；没有也不阻塞发布（APK 已由 AGP 签过）
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK"
          else
            echo "apksigner 不可用，跳过签名校验"
          fi

      - name: 保存混淆映射表
        # mapping.txt 不能提交进公开仓库（等于把混淆白做一遍），
        # 但还原 Release 崩溃栈必须要它，所以作为构建产物留存。
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn

      - name: 收集产物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ || true
          ls -la dist

      - name: 创建 GitHub Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
